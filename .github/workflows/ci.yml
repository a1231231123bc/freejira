name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: ['24', '26']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
        if: matrix.node == '24'
      - run: npm run test:ui
        if: matrix.node == '24'
  sites:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: editions/sites
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: editions/sites/package-lock.json
      - run: npm ci
      - run: cp .openai/hosting.example.json .openai/hosting.json
      - run: npx tsc --noEmit
      - run: node --test tests/video.test.mjs
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r processor/requirements-test.txt
      - run: python -m unittest discover -s processor -p 'test_*.py' -v
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build --tag freejira:test .
      - name: Start container and verify health
        run: |
          docker run --detach --name freejira-test --publish 127.0.0.1:4173:4173 freejira:test
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/api/health; then exit 0; fi
            sleep 2
          done
          docker logs freejira-test
          exit 1
      - name: Cleanup
        if: always()
        run: docker rm --force freejira-test || true
